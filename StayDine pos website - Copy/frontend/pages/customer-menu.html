<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - StayDine</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/customer-menu.css">
</head>
<body>
  <div class="customer-layout">
    <!-- Header -->
    <header class="customer-header">
      <div class="container flex-between">
        <div class="header-left">
          <h1 class="logo">StayDine</h1>
          <span class="table-badge" id="tableNumber">Table 5</span>
        </div>
        <div class="header-right">
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search menu items...">
            <button class="search-btn">🔍</button>
          </div>
          <button class="cart-btn">
            🛒
            <span class="cart-count" id="cartCount">0</span>
          </button>
        </div>
      </div>
    </header>

    <main class="customer-main">
      <!-- Categories -->
      <div class="categories-section">
        <div class="container">
          <div class="categories-scroll">
            <button class="category-btn active" data-category="all">All Items</button>
            <button class="category-btn" data-category="food">🍔 Food</button>
            <button class="category-btn" data-category="beverages">🥤 Beverages</button>
            <button class="category-btn" data-category="combos">📦 Combos</button>
            <button class="category-btn" data-category="desserts">🍰 Desserts</button>
          </div>
        </div>
      </div>

      <!-- Menu Items Grid -->
      <div class="container menu-container">
        <div class="menu-grid" id="menuGrid">
          <!-- Items will be loaded here -->
        </div>
      </div>
    </main>

    <!-- Cart Sidebar -->
    <aside class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2>Your Order</h2>
        <button class="close-cart">✕</button>
      </div>

      <div class="cart-items" id="cartItems">
        <p class="empty-cart">Your cart is empty</p>
      </div>

      <div class="cart-summary">
        <div class="summary-item">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>
        <div class="summary-item">
          <span>Tax (18%)</span>
          <span id="tax">₹0</span>
        </div>
        <div class="summary-line"></div>
        <div class="summary-total">
          <span>Total</span>
          <span id="total">₹0</span>
        </div>
      </div>

      <button class="btn btn-primary btn-block place-order-btn">Place Order</button>
    </aside>

    <!-- Item Detail Modal -->
    <div class="modal" id="itemModal">
      <div class="modal-content item-modal">
        <button class="modal-close">✕</button>
        <div class="item-detail-image">
          <img id="detailImage" src="" alt="Item">
        </div>
        <div class="item-detail-content">
          <h2 id="detailName"></h2>
          <div class="item-detail-rating">
            <span class="stars" id="detailRating"></span>
            <span id="detailReviews"></span>
          </div>
          <p class="item-description" id="detailDescription"></p>
          
          <div class="item-badges">
            <span class="badge" id="vegBadge" style="display:none;">🌱 Vegetarian</span>
            <span class="badge" id="spicyBadge" style="display:none;">🌶️ Spicy</span>
          </div>

          <div class="item-price">
            <span class="original-price" id="originalPrice"></span>
            <span class="final-price" id="finalPrice"></span>
          </div>

          <div class="quantity-selector">
            <button class="qty-btn minus">−</button>
            <input type="number" class="qty-input" value="1" min="1">
            <button class="qty-btn plus">+</button>
          </div>

          <div class="form-group">
            <label>Special Instructions (Optional)</label>
            <textarea id="instructions" placeholder="e.g., Extra spicy, No onions..."></textarea>
          </div>

          <button class="btn btn-primary btn-block add-to-cart-btn">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/frontend/js/api-client.js"></script>
  <script src="/frontend/js/customer-menu.js"></script>
</body>
</html>
